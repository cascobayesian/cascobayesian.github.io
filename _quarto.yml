project:
  type: website
  output-dir: docs
  resources:
    - files/cv_jobrien_2026.pdf
    - files/images/**

description-meta: "Jack O'Brien: statistician and data scientist, Bowdoin College"
author-meta: "Jack O'Brien"

website:
  title: "Jack O'Brien"
  site-url: "https://cascobayesian.github.io"
  description: "Jack O'Brien is an applied statistician and data scientist in the Department of Mathematics at Bowdoin College."
  image: "files/images/lake-chad-pottery.png"
  open-graph: true
  page-navigation: false
  back-to-top-navigation: true
  # Pages marked `draft: true` show up in `quarto preview` but are left out of the published site.
  draft-mode: gone

  navbar:
    background: light
    search: true
    collapse-below: lg
    left:
      - text: About
        href: index.qmd
      - text: Research
        menu:
          - text: Overview
            href: research.qmd
          - text: Mapping voting blocs
            href: research/voting-blocs.qmd
          - text: Local politics
            href: research/local-politics.qmd
          - text: Politics worldwide
            href: research/worldwide.qmd
          - text: Maine's history
            href: research/maine-history.qmd
          - text: Statistical innovations
            href: research/methods.qmd
          - text: Publications
            href: research/publications.qmd
          - text: Talks
            href: research/talks.qmd
      - text: Teaching
        href: teaching.qmd
      # Uncomment once the first video is published (see videos/_template.qmd).
      # - text: Videos
      #   href: videos.qmd
      - text: Outreach
        href: outreach.qmd
      - text: Students
        menu:
          - text: Student research
            href: students/research.qmd
          - text: Letters of recommendation
            href: students/letters.qmd
          - text: Appointments
            href: students/appointments.qmd
      - text: News
        href: news.qmd
      - text: CV
        href: cv.qmd
    right:
      - icon: envelope
        href: mailto:jobrien@bowdoin.edu
        aria-label: Email
      - icon: github
        href: https://github.com/cascobayesian
        aria-label: GitHub
        target: _blank

  page-footer:
    left: "&copy; 2026 Jack O'Brien &middot; Department of Mathematics, Bowdoin College &middot; 8600 College Station, Brunswick, Maine 04011"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    # Mockup: a single light theme, like the Masiello site.
    theme: [cosmo, theme-light.scss]
    css: styles.css
    toc: false
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    smooth-scroll: true
